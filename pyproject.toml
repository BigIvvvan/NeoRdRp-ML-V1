[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neordrp-ml-v1"
version = "1.0.0"
description = "RNA-dependent RNA polymerase detection, family classification, and boundary prediction"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "BigIvan"}]
keywords = ["bioinformatics", "RNA virus", "RdRp", "Mamba", "protein"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "huggingface-hub>=0.24",
  "numpy>=1.26",
  "PyYAML>=6.0",
  "torch>=2.4",
]

[project.optional-dependencies]
train = [
  "pandas>=2.2",
  "pyarrow>=16",
  "scikit-learn>=1.5",
]
embed = [
  "esm>=3.1",
  "transformers>=4.45",
]
dev = [
  "build>=1.2",
  "pytest>=8",
  "ruff>=0.8",
]

[project.scripts]
neordrp-ml-v1 = "neordrp_ml_v1.cli:main"
neordrp-ml-v1-train = "neordrp_ml_v1.training_cli:main"

[project.urls]
Homepage = "https://github.com/BigIvvvan/NeoRdRp-ML-V1"
Model = "https://huggingface.co/BigIvvvan/NeoRdRp-ML-V1"
Issues = "https://github.com/BigIvvvan/NeoRdRp-ML-V1/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
neordrp_ml_v1 = ["assets/*.fasta", "assets/*.npz", "assets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
